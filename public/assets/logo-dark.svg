<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="240" height="48" fill="none">
  <defs>
    <linearGradient id="vc-icon-grad-d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="vc-text-grad-d" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Badge -->
  <g transform="translate(4, 4)">
    <rect width="40" height="40" rx="10" fill="url(#vc-icon-grad-d)"/>
    
    <!-- Vacuum Cyclone Suction Funnel Rings -->
    <path d="M 11 12 C 16 9, 28 9, 29 14 C 30 19, 19 22, 15 25 C 12 27, 15 31, 21 31 C 26 31, 29 28, 30 26" 
          stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="20" cy="20" r="2.5" fill="#e0f2fe"/>
    
    <!-- Side Verified Rating Badge -->
    <circle cx="30" cy="10" r="4.5" fill="#10b981"/>
    <path d="M28 10 L29.5 11.5 L32.5 8.5" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Typography -->
  <text x="54" y="30" font-family="'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="22" fill="#ffffff" letter-spacing="-0.5">Vac<tspan fill="url(#vc-text-grad-d)">Compare</tspan></text>
  <text x="55" y="41" font-family="'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="8" fill="#94a3b8" letter-spacing="1.2">REVIEWS &amp; BENCHMARKS</text>
</svg>
